
name: TV2 - Security Scanning

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan secrets
        id: scan
        shell: bash
        run: |
          set +e
          gitleaks git . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

      - name: Enforce Gitleaks gate
        if: always() && steps.scan.outputs.exit_code != ''
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: exit "$SCAN_EXIT"

  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan source code
        id: scan
        shell: bash
        run: |
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --severity ERROR \
            --json \
            --output semgrep-report.json \
            --error .
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn

      - name: Enforce Semgrep gate
        if: always() && steps.scan.outputs.exit_code != ''
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: exit "$SCAN_EXIT"

  
  
  
  dependency_check:
    name: OWASP Dependency-Check - SCA
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependency-Check
        shell: bash
        run: |
          set -e
          VERSION=$(curl -fsSL https://dependency-check.github.io/DependencyCheck/current.txt)
          echo "Dependency-Check version: $VERSION"

          curl -fL --retry 3 \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip" \
            -o dependency-check.zip

          unzip -q dependency-check.zip
          chmod +x dependency-check/bin/dependency-check.sh
          dependency-check/bin/dependency-check.sh --version

      - name: Cache vulnerability database
        uses: actions/cache@v4
        with:
          path: dependency-check/data
          key: dependency-check-db-${{ runner.os }}-v1
          restore-keys: |
            dependency-check-db-${{ runner.os }}-

      - name: Scan dependencies
        id: scan
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports

          ARGS=(
            --project "DevSecOps Pipeline"
            --scan .
            --out reports
            --format HTML
            --format JSON
            --failOnCVSS 7
            --data dependency-check/data
          )

          if [ -n "$NVD_API_KEY" ]; then
            ARGS+=(--nvdApiKey "$NVD_API_KEY")
          fi

          set +e
          dependency-check/bin/dependency-check.sh "${ARGS[@]}"
          RESULT=$?
          set -e

          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports/
          if-no-files-found: warn

      - name: Enforce Dependency-Check gate
        if: always() && steps.scan.outputs.exit_code != ''
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: exit "$SCAN_EXIT"



