
name: TV2 - Security Scanning

on:
  workflow_dispatch:
  pull_request:
    branches: [main, tv2-deploy]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan secrets
        id: scan
        shell: bash
        run: |
          set +e
          gitleaks git . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

      - name: Enforce Gitleaks gate
        if: always() && steps.scan.outputs.exit_code != ''
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: exit "$SCAN_EXIT"

  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan source code
        id: scan
        shell: bash
        run: |
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --severity ERROR \
            --json \
            --output semgrep-report.json \
            --error .
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn

      - name: Enforce Semgrep gate
        if: always() && steps.scan.outputs.exit_code != ''
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: exit "$SCAN_EXIT"

  
  
  
  
  trivy_fs:
    name: Trivy - SCA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Trivy CLI
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://get.trivy.dev/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://get.trivy.dev/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      - name: Scan dependencies
        id: scan
        shell: bash
        run: |
          set +e

          trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --format json \
            --output trivy-report.json \
            --exit-code 1 \
            --no-progress

          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Trivy gate
        if: always() && steps.scan.outputs.exit_code != ''
        shell: bash
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          if [ "$SCAN_EXIT" -ne 0 ]; then
            echo "Trivy failed or found HIGH/CRITICAL vulnerabilities."
            exit 1
          fi

          echo "Trivy security gate passed."


