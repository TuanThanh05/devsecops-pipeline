name: DevSecOps Pipeline

on:
  push:
    branches: [ main, tv1-deploy ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # STAGE 1: CHECKOUT & SETUP
  # ============================================
  checkout:
    name: "📦 Checkout Code"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: echo "Checking out code from repository..."
      
      - name: Display branch info
        run: echo "Branch - ${{ github.ref_name }}"

  # ============================================
  # STAGE 2: SECURITY SCANNING (Parallel)
  # ============================================
  secret-scanning:
    name: "🔐 Secret Scanning"
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Run GitLeaks
        run: echo "Running GitLeaks to scan for secrets..."
      
      - name: Check for hardcoded credentials
        run: echo "Scanning for API keys, passwords, tokens..."

  sast-scan:
    name: "🔍 SAST - Static Code Analysis"
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Run Semgrep
        run: echo "Running Semgrep for static analysis..."
      
      - name: Check code quality
        run: echo "Analyzing code for security vulnerabilities..."

  sca-scan:
    name: "📚 SCA - Dependency Check"
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Run Trivy for dependencies
        run: echo "Running Trivy to scan dependencies..."
      
      - name: Check vulnerable libraries
        run: echo "Checking requirements.txt for known vulnerabilities..."

  # ============================================
  # STAGE 3: BUILD
  # ============================================
  build:
    name: "🏗️ Build Application"
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-scan, sca-scan]
    steps:
      - name: Setup Python
        run: echo "Setting up Python ${{ env.PYTHON_VERSION }}..."
      
      - name: Install dependencies
        run: echo "Installing dependencies from requirements.txt..."
      
      - name: Run unit tests
        run: echo "Running unit tests..."
      
      - name: Build Docker image
        run: echo "Building Docker image..."

  # ============================================
  # STAGE 4: CONTAINER SECURITY
  # ============================================
  container-scan:
    name: "🐳 Container Security Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Trivy on Docker image
        run: echo "Scanning Docker image for vulnerabilities..."
      
      - name: Check for OS vulnerabilities
        run: echo "Checking base image and layers..."

  # ============================================
  # STAGE 5: QUALITY GATE
  # ============================================
  quality-gate:
    name: "🚦 Quality Gate"
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan, secret-scanning, container-scan]
    steps:
      - name: Evaluate security findings
        run: echo "Evaluating all security scan results..."
      
      - name: Check severity thresholds
        run: echo "Checking if Critical/High vulnerabilities exist..."
      
      - name: Decision - Pass or Fail
        run: echo "Quality Gate - PASSED ✅"

  # ============================================
  # STAGE 6: DEPLOY (only if Quality Gate passes)
  # ============================================
  deploy-staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/tv1-deploy'
    steps:
      - name: Deploy to staging environment
        run: echo "Deploying to staging environment..."
      
      - name: Run smoke tests
        run: echo "Running smoke tests on staging..."

  deploy-production:
    name: "🌐 Deploy to Production"
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production environment
        run: echo "Deploying to production environment..."
      
      - name: Health check
        run: echo "Performing health check..."
      
      - name: Send notification
        run: echo "Sending deployment notification..."

  # ============================================
  # STAGE 7: NOTIFICATION
  # Dùng always() để chạy dù deploy bị skip
  # ============================================
  notify:
    name: "📧 Send Notification"
    runs-on: ubuntu-latest
    needs: quality-gate          # ← chỉ cần quality-gate, không cần deploy
    if: always()
    steps:
      - name: Pipeline result
        run: echo "Pipeline completed with status - ${{ job.status }}"
