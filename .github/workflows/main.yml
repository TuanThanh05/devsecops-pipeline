name: DevSecOps Pipeline
permissions:
  contents: read
on:
  push:
    branches: [ main, dev-project, tv1-deploy, tv2-deploy, tv3-deploy ]
  pull_request:
    branches: [ main, dev-project ]
  workflow_dispatch:

  # STAGE 1 ENV

env:
  PYTHON_VERSION: '3.11'
  GATE_SEVERITY: HIGH,CRITICAL

jobs:
  # STAGE 2 SCAN PROJECT
  # 2a quet cac tu khoa nhay cam
  secret-scan:
    name: "Secret Scanning"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    # Lay ma nguon
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      # Quet va chan
      - name: SC Scan By Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
      
      # Ghi Summary
      - name: Secret scanning Scan Report
        if: always()
        env:
          SCAN_RESULT: ${{ steps.gitleaks.outcome }}
        run: python3 scripts/secret_summary.py

  # =========================================================
  # SAST (STATIC APPLICATION SECURITY TESTING): QUET MA NGUON TRONG TOAN REPOSITORY
  # =========================================================
  sast-scan:
    name: "Static Code Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:

      # Chuan bi
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Chuan bi thu muc bao cao
      - name: Prepare reports
        run: |
          report_dir="$RUNNER_TEMP/sast-scan-reports"
          mkdir -p "$report_dir"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"
      
      # Cai Semgrep
      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep --version > "$REPORT_DIR/semgrep-version.txt"
      
      # SAST chay quet
      - name: SAST Scan by Semgrep
        id: semgrep
        run: |
          scan_exit=0

          # Quet ma nguon toan repository, ngoai tru workflow chinh.
          semgrep scan --config p/security-audit \
            --config p/owasp-top-ten --exclude .github/workflows/main.yml \
            --metrics off --strict --json-output "$REPORT_DIR/semgrep.json" \
            --sarif-output "$REPORT_DIR/semgrep.sarif" . || scan_exit=$?

          echo "$scan_exit" > "$REPORT_DIR/semgrep-exit-code.txt"

          {
            echo "### Pham vi SAST"
            echo ""
            echo "Quet ma nguon duoc ho tro trong toan repository."
            echo "Ngoai le: .github/workflows/main.yml."
          } >> "$GITHUB_STEP_SUMMARY"
      
      # danh gia gate
      - name: gate-sast
        run: python3 scripts/sast_gate.py

      # Upload bao cao khi gate ket thuc
      - name: SAST Scan Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast-scan-report
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  # quet thanh phan phu thuoc
  sca-scan:
    name: "Software Composition Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env: 
      # chan cac lo hong chua co ban va
      BLOCK_UNFIXED: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare reports folder
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/sca-scan-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sca-scan-report"
      
      # bao cao sca sau khi quet
      - name: SCA Scan By Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: false
          list-all-pkgs: true
          format: json
          output: ${{ env.REPORT_DIR }}/trivy-fs.json
          exit-code: '0'

      # quet bao cao va chan
      - name: gate-sca
        run: |
          python3 scripts/sca_gate.py --report "$REPORT_DIR/trivy-fs.json"

      # luu bao cao
      - name: Upload SCA Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca-scan-report
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  # dung va quet anh dong goi
  container-scan:
    name: "Build And Scan Container"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [secret-scan, sast-scan, sca-scan]
    permissions:
      contents: read
    env:
      # ten image cua docker
      IMAGE: devsecops-app:${{github.sha}}
      BLOCK_UNFIXED: 'false'
    
    steps:
      # tai code cua repo ve may ao
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare report folder
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/container-scan-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/container-scan-report"

      # build docker thanh image
      - name: Build Image
        run: docker build -t "$IMAGE" .

      # kiem tra app hoat dong
      - name: Test App
        run: |
          docker run -d --name app-demo -p 5000:5000 "$IMAGE"
          for _ in $(seq 1 10); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "Timeout 20 second"
          docker logs app-demo
          exit 1

      # kiem tra tinh trang user
      - name: Test user container
        run: test "$(docker run --rm "$IMAGE" whoami)" = "appuser"
    
      # luon bao cao day du, script moi quyet dinh chan hay canh bao
      - name: Container Scan By Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: false
          list-all-pkgs: true
          format: json
          output: ${{ env.REPORT_DIR }}/trivy-image.json
          exit-code: '0'


      # cong quet bao cao va chan
      - name: gate-container
        run: |
          python3 scripts/container_gate.py --report "$REPORT_DIR/trivy-image.json"


      # luu bao cao
      - name: Upload Container Report
        if: always()  
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-report
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14


  # STAGE 4 DEPLOY PRODUCTION
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secret-scan, sast-scan, sca-scan, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    steps:
      # kiem tra co ma secret va dung khi thieu
      - name: Check deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing secret RENDER_DEPLOY_HOOK"
            exit 1
          fi

      # goi deploy hook cua render, kem ma commit da qua 4 cong
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"
          echo ""
          echo "Render accepted deploy request for commit ${GITHUB_SHA}"

      # build va kiem tra web chay voi commit moi
      - name: Verify new version is live
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$APP_URL/health" | grep -q "$GITHUB_SHA"; then
              echo "Commit ${GITHUB_SHA} is live at ${APP_URL}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Commit ${GITHUB_SHA} is not live at ${APP_URL} after 10 minutes"
          exit 1

  # STAGE 5 NOTIFICATION
  notify:
    name: "Notification"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-scan, sca-scan, container-scan, deploy-production]
    if: always()
    steps:
      - name: Pipeline result
        run: |
          {
            echo "## Security Gate Results"
            echo ""
            echo "| Gate | Tool | Result |"
            echo "|---|---|---|"
            echo "| Secret Scan | Gitleaks | ${{ needs.secret-scan.result }} |"
            echo "| SAST | Semgrep | ${{ needs.sast-scan.result }} |"
            echo "| SCA | Trivy fs | ${{ needs.sca-scan.result }} |"
            echo "| Container Scan | Trivy image | ${{ needs.container-scan.result }} |"
            echo "| Deploy | Render | ${{ needs.deploy-production.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

    

  # STAGE 6 FAILURE EMAIL
  failure-email:
    name: "Failure Email"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-scan, sca-scan, container-scan, deploy-production]
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline <${{ secrets.MAIL_USERNAME }}>
          subject: "[DEPLOY BLOCKED] ${{ github.repository }} - Branch ${{ github.ref_name }}"
          body: |
            Security alert, deploy blocked

            Pushed by : ${{ github.actor }}
            Branch    : ${{ github.ref_name }}
            Commit    : ${{ github.sha }}

            Reports:
              Secret Scan    : ${{ needs.secret-scan.result }}
              SAST           : ${{ needs.sast-scan.result }}
              SCA            : ${{ needs.sca-scan.result }}
              Container Scan : ${{ needs.container-scan.result }}
              Deploy         : ${{ needs.deploy-production.result }}

            View details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # STAGE 7 SUCCESS EMAIL
  success-email:
    name: "Success Email"
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline <${{ secrets.MAIL_USERNAME }}>
          subject: "[DEPLOY SUCCEEDED] ${{ github.repository }}"
          body: |
            Deployment successful.

            Pushed by : ${{ github.actor }}
            Branch    : ${{ github.ref_name }}
            Commit    : ${{ github.sha }}

            View details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}