name: DevSecOps Pipeline
permissions:
  contents: read
  security-events: write 
on:
  push:
    branches: [ main, dev-project, tv1-deploy, tv2-deploy, tv3-deploy ]
  pull_request:
    branches: [ main, dev-project ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  GATE_SEVERITY: HIGH,CRITICAL

jobs:
    # =========================================================
  # SECRET SCANNING
  # =========================================================
  secret-scanning:
    name: "Secret Scanning"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chỉ bắt buộc với repository thuộc Organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Secret scanning summary
        if: always()
        env:
          SCAN_RESULT: ${{ steps.gitleaks.outcome }}
        shell: bash
        run: |
          {
            echo "## TV2 - Secret Scanning"
            echo ""
            echo "| Nội dung | Kết quả |"
            echo "|---|---|"
            echo "| Công cụ | Gitleaks |"
            echo "| Trạng thái bước quét | $SCAN_RESULT |"
            echo "| Chính sách | Chặn khi phát hiện secret hoặc scanner lỗi |"
            echo "| Báo cáo | Artifact SARIF do Gitleaks Action quản lý |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # SAST: QUÉT MÃ NGUỒN TRONG TOÀN REPOSITORY
  # =========================================================
  sast-scan:
    name: "SAST - Static Code Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Prepare reports
        shell: bash
        run: |
          report_dir="$RUNNER_TEMP/tv2-sast-reports"
          mkdir -p "$report_dir"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

      - name: Install Semgrep
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep --version > "$REPORT_DIR/semgrep-version.txt"

      - name: Scan repository with Semgrep
        id: semgrep
        shell: bash
        run: |
          scan_exit=0

          # Quét mã nguồn toàn repository, ngoại trừ workflow chính.
          # Bảo mật file workflow được theo dõi riêng bởi TV1.
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --exclude .github/workflows/main.yml \
            --metrics off \
            --strict \
            --json-output "$REPORT_DIR/semgrep.json" \
            --sarif-output "$REPORT_DIR/semgrep.sarif" \
            . || scan_exit=$?

          echo "$scan_exit" > "$REPORT_DIR/semgrep-exit-code.txt"

          {
            echo "### Phạm vi SAST"
            echo ""
            echo "Quét mã nguồn được hỗ trợ trong toàn repository."
            echo "Ngoại lệ: .github/workflows/main.yml."
            echo "File workflow cần được TV1 kiểm tra bảo mật riêng."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate SAST quality gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          reports = Path(os.environ["REPORT_DIR"])
          report_file = reports / "semgrep.json"
          exit_file = reports / "semgrep-exit-code.txt"

          try:
              scanner_exit = int(exit_file.read_text().strip())
              data = json.loads(report_file.read_text())
              if not isinstance(data, dict):
                  raise ValueError("JSON root must be an object")
              if not isinstance(data.get("results"), list):
                  raise ValueError("Missing or invalid results")
          except Exception as exc:
              print(f"::error::Semgrep report is missing or invalid: {exc}")
              sys.exit(1)

          findings = data["results"]
          errors = data.get("errors", [])
          paths = data.get("paths", {})
          scanned = paths.get("scanned", [])
          skipped = paths.get("skipped", [])

          def blocks_gate(finding):
              extra = finding.get("extra", {})
              metadata = extra.get("metadata", {})
              if not isinstance(metadata, dict):
                  metadata = {}

              impact = str(
                  metadata.get("impact") or
                  metadata.get("severity") or ""
              ).upper()

              # Metadata mức độ được ưu tiên nếu nhận diện được.
              if impact in {"HIGH", "CRITICAL"}:
                  return True
              if impact in {"LOW", "MEDIUM", "MODERATE", "INFO"}:
                  return False

              # Quy ước dự phòng của nhóm khi thiếu metadata.
              return str(extra.get("severity", "")).upper() == "ERROR"

          blocking = [f for f in findings if blocks_gate(f)]
          counts = Counter(
              str(f.get("extra", {}).get("severity", "UNKNOWN")).upper()
              for f in findings
          )

          # Lỗi scanner hoặc không phân tích được file nào không được coi là sạch.
          scan_error = scanner_exit != 0 or bool(errors) or not scanned
          status = "ERROR" if scan_error else "BLOCKED" if blocking else "PASS"

          lines = [
              "## TV2 - SAST / Semgrep",
              "",
              "| Nội dung | Kết quả |",
              "|---|---|",
              f"| Quality Gate | {status} |",
              f"| File đã phân tích | {len(scanned)} |",
              f"| Mục bỏ qua được ghi trong JSON | {len(skipped)} |",
              f"| Tổng finding | {len(findings)} |",
              f"| Finding bị chặn | {len(blocking)} |",
              f"| Lỗi phân tích | {len(errors)} |",
              f"| Exit code scanner | {scanner_exit} |",
              "",
              "### Finding theo severity của rule",
              "",
              "| Severity | Số lượng |",
              "|---|---|",
          ]
          lines += [f"| {key} | {value} |" for key, value in sorted(counts.items())]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")

          (reports / "gate-result.json").write_text(
              json.dumps({
                  "status": status,
                  "scanned_files": len(scanned),
                  "findings": len(findings),
                  "blocking_findings": len(blocking),
                  "scanner_exit_code": scanner_exit,
                  "analysis_errors": len(errors),
              }, indent=2)
          )

          if scan_error:
              print("::error::Semgrep failed or scan coverage is incomplete.")
              sys.exit(1)
          if blocking:
              print("::error::SAST quality gate blocked deployment.")
              sys.exit(1)
          PY

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tv2-sast-reports
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  # STAGE 2c SCA SCAN DEPENDENCY CHECK
  sca-scan:
    name: "Software Composition Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env: 
      # chan cac lo hong chua co ban va
      BLOCK_UNFIXED: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare reports folder
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/sca-scan-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sca-scan-report"
      
      # bao cao sca sau khi quet
      - name: SCA Scan By Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: false
          list-all-pkgs: true
          format: json
          output: ${{ env.REPORT_DIR }}/trivy-fs.json
          exit-code: '0'

      # quet bao cao va chan
      - name: gate-sca
        run: |
          python3 scripts/trivy_gate.py \
            --report "$REPORT_DIR/trivy-fs.json" \
            --title "Stage 2 · SCA / Trivy filesystem"

      # luu bao cao
      - name: Upload SCA Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca-scan-report
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  # STAGE 3 DOCKER BUILD AND SCAN CONTAINER
  container-scan:
    name: "Build And Scan Container"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secret-scanning, sast-scan, sca-scan]
    permissions:
      contents: read
    env:
      # ten image cua docker
      IMAGE: devsecops-app:${{github.sha}}
      BLOCK_UNFIXED: 'false'
    
    steps:
      # tai code cua repo ve may ao
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare report folder
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/container-scan-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/container-scan-report"

      # build docker thanh image
      - name: Build Image
        run: docker build -t "$IMAGE" .

      # kiem tra app hoat dong
      - name: Test App
        run: |
          docker run -d --name app-demo -p 5000:5000 "$IMAGE"
          for _ in $(seq 1 10); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "Timeout 20 second"
          docker logs app-demo
          exit 1

      # kiem tra tinh trang user
      - name: Test user container
        run: test "$(docker run --rm "$IMAGE" whoami)" = "appuser"
    
      # luon bao cao day du, script moi quyet dinh chan hay canh bao
      - name: Container Scan By Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: false
          list-all-pkgs: true
          format: json
          output: ${{ env.REPORT_DIR }}/trivy-image.json
          exit-code: '0'


      # cong quet bao cao va chan
      - name: gate-container
        run: |
          python3 scripts/trivy_gate.py \
            --report "$REPORT_DIR/trivy-image.json" \
            --title "Stage 3 · Container Scan / Trivy image"


      # luu bao cao
      - name: Upload Container Report
        if: always()  
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-report
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14


  # STAGE 4 DEPLOY PRODUCTION
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-scan, sca-scan, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production environment
        run: echo "Deploying to production environment..."


  # STAGE 5 NOTIFICATION
  notify:
    name: "Notification"
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-scan, sca-scan, container-scan, deploy-production]
    if: always()
    steps:
      - name: Pipeline result
        run: |
          {
            echo "## Security Gate Results"
            echo ""
            echo "| Gate | Tool | Result |"
            echo "|---|---|---|"
            echo "| Secret Scan | Gitleaks | ${{ needs.secret-scanning.result }} |"
            echo "| SAST | Semgrep | ${{ needs.sast-scan.result }} |"
            echo "| SCA | Trivy fs | ${{ needs.sca-scan.result }} |"
            echo "| Container Scan | Trivy image | ${{ needs.container-scan.result }} |"
            echo "| Deploy | Render | ${{ needs.deploy-production.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

    

  # STAGE 6 FAILURE EMAIL
  failure-email:
    name: "Failure Email"
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-scan, sca-scan, container-scan, deploy-production]
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline <${{ secrets.MAIL_USERNAME }}>
          subject: "[DEPLOY BLOCKED] ${{ github.repository }} - Branch ${{ github.ref_name }}"
          body: |
            Security alert, deploy blocked

            Pushed by : ${{ github.actor }}
            Branch    : ${{ github.ref_name }}
            Commit    : ${{ github.sha }}

            Reports:
              Secret Scan    : ${{ needs.secret-scanning.result }}
              SAST           : ${{ needs.sast-scan.result }}
              SCA            : ${{ needs.sca-scan.result }}
              Container Scan : ${{ needs.container-scan.result }}
              Deploy         : ${{ needs.deploy-production.result }}

            View details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # STAGE 7 SUCCESS EMAIL
  success-email:
    name: "Success Email"
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline <${{ secrets.MAIL_USERNAME }}>
          subject: "[DEPLOY SUCCEEDED] ${{ github.repository }}"
          body: |
            Deployment successful.

            Pushed by : ${{ github.actor }}
            Branch    : ${{ github.ref_name }}
            Commit    : ${{ github.sha }}

            View details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}