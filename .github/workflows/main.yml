name: DevSecOps Pipeline
permissions:
  contents: read
  security-events: write 
on:
  push:
    branches: [ main, dev-project, tv1-deploy, tv2-deploy, tv3-deploy ]
  pull_request:
    branches: [ main, dev-project, tv1-deploy, tv2-deploy, tv3-deploy ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  GATE_SEVERITY: HIGH,CRITICAL

jobs:
  secret-scanning:
    name: "Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # GitLeaks cần full history

      - name: Display pipeline info
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Actor      : ${{ github.actor }}"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true


  sast-scan:
    name: "SAST - Static Code Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate app.py exists
        run: |
          if [ ! -f "app.py" ]; then
            echo "Thiếu app.py"
            exit 1
          fi
          echo "app.py found — bắt đầu quét SAST"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SARIF output)
        id: semgrep
        run: |
          semgrep \
            --config=p/security-audit \
            --config=p/python \
            --config=p/owasp-top-ten \
            --sarif \
            --output=semgrep.sarif \
            .
        continue-on-error: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Fail on security issues
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "SAST found security vulnerabilities!"
          exit 1


  sca-scan:
    name: "SCA - Dependency Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate requirements.txt exists
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo " Thiếu requirements.txt"
            exit 1
          fi
          echo "requirements.txt found — bắt đầu quét SCA"
          cat requirements.txt

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy and fail on vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # STAGE 3 DOCKER BUILD AND SCAN CONTAINER
  container-scan:
      name: "Build And Scan Container"
      runs-on: ubuntu-latest
      needs: [secret-scanning, sast-scan, sca-scan]
      env: 
        # ten image cua docker
        IMAGE: devsecops-app:${{github.sha}}
      
      steps:
        # tai code cua repo ve may ao
        - name: Checkout code
          uses: actions/checkout@v4
        
        # build docker thanh image
        - name: Build Image
          run: docker build -t "$IMAGE" .

        # kiem tra app hoat dong
        - name: Test App
          run: |
            docker run -d --name app-demo -p 5000:5000 "$IMAGE"
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:5000/health; then exit 0; fi
              sleep 2
            done
            echo "Timeout 20 second"
            docker logs app-demo
            exit 1

        # kiem tra tinh trang user
        - name: Test user container
          run: test "$(docker run --rm "$IMAGE" whoami)" = "appuser"
      
        # quet container lan 1 lay bao cao tong the
        - name: Scan Container By Trivy
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
          with: 
            image-ref: ${{ env.IMAGE }}
            # bo qua cac lo hong chua co ban va
            ignore-unfixed: true 
            format: json
            output: trivy-image.json

        # quet container lan 2 chan cac muc lo hong HIGH hoac CRITICAL
        - name: gate-container
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
          with: 
            image-ref: ${{ env.IMAGE }}
            severity: ${{ env.GATE_SEVERITY }}
            ignore-unfixed: true
            exit-code: '1'
            format: table

        # luu bao cao
        - name: Container Scan Report
          if: always()  
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
          with:
            name: container-scan-report 
            path: trivy-image.json

  # STAGE 4 DEPLOY PRODUCTION
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-scan, sca-scan, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production environment
        run: echo "Deploying to production environment..."


 #  STAGE 5 NOTIFICATION
  notify:
    name: "Stage 6 · Notification"
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast-scan, sca-scan, container-scan, deploy-production]
    if: always()
    steps:
      - name: Pipeline result
        run: |
          echo "Secret Scan   : ${{ needs.secret-scanning.result }}"
          echo "SAST          : ${{ needs.sast-scan.result }}"
          echo "SCA           : ${{ needs.sca-scan.result }}"
          echo "Container Scan: ${{ needs.container-scan.result }}"
          echo "Deploy        : ${{ needs.deploy-production.result }}"
