name: Build And Scan Container

on:
  push:
    branches: [main, dev-project, tv3-deploy]
  workflow_dispatch:

permissions:
  contents: read   

jobs:
  build-and-scan-container:
    name: "Build And Scan Container"
    runs-on: ubuntu-latest
    env: 
      # ten image cua docker
      IMAGE: devsecops-app:${{github.sha}}
    
    steps:
      # tai code cua repo ve may ao
      - name: Checkout code
        uses: actions/checkout@v4
      
      # build docker thanh image
      - name: Build Image
        run: docker build -t "$IMAGE" .

      # kiem tra app hoat dong
      - name: Test App
        run: |
          docker run -d --name app-demo -p 5000:5000 "$IMAGE"
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "Timeout 20 second"
          docker logs app-demo
          exit 1

      # kiem tra tinh trang user
      - name: Test user container
        run: test "$(docker run --rm "$IMAGE" whoami)" = "appuser"
    
      # quet container lan 1 lay bao cao tong the
      - name: First Scan Container By Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: 
          image-ref: ${{ env.IMAGE }}
          # bo qua cac lo hong chua co ban va
          ignore-unfixed: true 
          format: json
          output: trivy-image.json

      # quet container lan 2 chan cac muc lo hong HIGH hoac CRITICAL
      - name: Second Scan Container By Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v7.0.2
        with: 
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # luu bao cao
      - name: Scan Report
        if: always()  
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-image-report
          path: trivy-image.json
